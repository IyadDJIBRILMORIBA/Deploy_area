services:
  # --- Service Base de Données ---
  db:
    image: mariadb:10.11
    container_name: area_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: area_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - area_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- Service Backend (Laravel) ---
  server:
    image: area_backend_image   
    build:
      context: ./backend-area
      dockerfile: Dockerfile
    container_name: area_server
    restart: unless-stopped
    ports:
      - "8080:8000" # Expose le port 8080 vers l'extérieur
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: area_db
      DB_USERNAME: user
      DB_PASSWORD: password
      APP_URL: http://localhost:8080
    env_file:
      - ./backend-area/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - area_network
    volumes:
      - ./backend-area:/var/www

  # --- Service Mobile Builder (Flutter) ---
  client_mobile:
    build:
      context: ./flutter_application
      dockerfile: Dockerfile
    container_name: area_mobile_builder
    # Ce conteneur a pour seul but de compiler l'APK et de s'arrêter
    volumes:
      - apk_volume:/app/output
    networks:
      - area_network

  # --- Service Frontend (Nuxt) ---
  client_web:
    build:
      context: ./frontend-area
      dockerfile: Dockerfile
    container_name: area_client_web
    restart: unless-stopped
    ports:
      - "8081:3000" # Expose le port 8081 vers l'extérieur
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:8080
      # URL interne pour le SSR (Server Side Rendering)
      API_INTERNAL_URL: http://server:8000 
    volumes:
      # On récupère l'APK compilé par le service mobile pour le rendre téléchargeable
      - apk_volume:/app/public/mobile
    depends_on:
      - server
    networks:
      - area_network
  scheduler:
    image: area_backend_image
    container_name: area_scheduler
    restart: unless-stopped
    depends_on:
      - server
      - db
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: area_db
      DB_USERNAME: user
      DB_PASSWORD: password
    env_file:
      - ./backend-area/.env
    volumes:
      - ./backend-area:/var/www
    command: php artisan schedule:work
    networks:
      - area_network

volumes:
  db_data:
  apk_volume: # Le volume partagé pour l'APK

networks:
  area_network:
    driver: bridge