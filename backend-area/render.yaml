services:
  - type: web
    name: area-backend
    env: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./Dockerfile.production
    dockerContext: .
    envVars:
      - key: APP_NAME
        value: AREA
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        sync: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: area-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: area-postgres
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: area-postgres
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: area-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: area-postgres
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: error
      # OAuth Configuration
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_REDIRECT_URI
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: SPOTIFY_REDIRECT_URI
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_REDIRECT_URI
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false

databases:
  - name: area-postgres
    databaseName: area_database
    user: area_user
    plan: free
    postgresMajorVersion: 16
