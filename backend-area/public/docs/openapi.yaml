  '/api/services/{serviceId}/connect':
    post:
      summary: 'Connect a service via OAuth'
      operationId: connectAServiceViaOAuth
      description: "Initiates or completes the OAuth connection process for a service.\nReturns the OAuth URL if not yet connected, or saves the connection\nif auth_code is provided."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'OAuth URL generated'
                  oauth_url: 'https://accounts.google.com/o/oauth2/auth?...'
                properties:
                  message:
                    type: string
                    example: 'OAuth URL generated'
                  oauth_url:
                    type: string
                    example: 'https://accounts.google.com/o/oauth2/auth?...'
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Service connected successfully'
                  connection:
                    id: 1
                    service_id: 1
                    service_name: google
                    connected_at: '2025-12-06T10:30:00Z'
                properties:
                  message:
                    type: string
                    example: 'Service connected successfully'
                  connection:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      service_id:
                        type: integer
                        example: 1
                      service_name:
                        type: string
                        example: google
                      connected_at:
                        type: string
                        example: '2025-12-06T10:30:00Z'
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Service not found'
                properties:
                  message:
                    type: string
                    example: 'Service not found'
      tags:
        - Services
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                auth_code:
                  type: string
                  description: 'optional The OAuth authorization code (for completing connection).'
                  example: architecto
                access_token:
                  type: string
                  description: 'optional The OAuth access token (for mobile flow).'
                  example: architecto
                refresh_token:
                  type: string
                  description: 'optional The OAuth refresh token.'
                  example: architecto
    parameters:
      -
        in: path
        name: serviceId
        description: 'The ID of the service to connect.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/services/{serviceId}/disconnect':
    delete:
      summary: 'Disconnect a service'
      operationId: disconnectAService
      description: "Removes the OAuth connection between the user and the service.\nAll AREAs using this service will be deactivated."
